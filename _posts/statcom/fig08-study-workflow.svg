   <g id="text_1">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18334c" x="43.2" y="47.837031" transform="rotate(-0 43.2 47.837031)">08  |  A study-led sizing and selection workflow</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="43.2" y="81.485156" transform="rotate(-0 43.2 81.485156)">Select location, current capability, energy and controls against explicit operating scenarios and acceptance criteria.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f8c" x="300.6" y="217.7605" transform="rotate(-0 300.6 217.7605)">1  Define the duty</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #506477" x="300.6" y="247.35525" transform="rotate(-0 300.6 247.35525)">PCC limits • load / generation cases • outages</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18334c" x="300.6" y="354.5605" transform="rotate(-0 300.6 354.5605)">2  Screen sites and ratings</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #506477" x="300.6" y="384.15525" transform="rotate(-0 300.6 384.15525)">load flow • Q–V / P–V • reserve • voltage sensitivity</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18334c" x="300.6" y="491.3605" transform="rotate(-0 300.6 491.3605)">3  Check dynamic voltage response</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #506477" x="300.6" y="520.95525" transform="rotate(-0 300.6 520.95525)">RMS studies • load recovery • ride-through • limits</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18334c" x="853.2" y="491.423" transform="rotate(-0 853.2 491.423)">4  Resolve fast interactions</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #506477" x="853.2" y="520.95525" transform="rotate(-0 853.2 520.95525)">EMT • weak-grid behavior • controls • switching</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18334c" x="853.2" y="354.5605" transform="rotate(-0 853.2 354.5605)">5  Verify the complete installation</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #506477" x="853.2" y="384.15525" transform="rotate(-0 853.2 384.15525)">harmonics • resonance • protection • thermal duty</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f8c" x="853.2" y="217.7605" transform="rotate(-0 853.2 217.7605)">6  Specify and validate</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #506477" x="853.2" y="247.35525" transform="rotate(-0 853.2 247.35525)">capability curves • models • FAT / HIL • site tests</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #bc6b15" x="576" y="660.089219" transform="rotate(-0 576 660.089219)">If a limit or instability appears: revise rating, location, topology or control tuning and repeat.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #bc6b15" x="576" y="719.576406" transform="rotate(-0 576 719.576406)">No single MW-to-MVAr percentage or short-circuit-ratio threshold replaces the project studies.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="43.2" y="794.897344" transform="rotate(-0 43.2 794.897344)">Original engineering workflow. Study order is iterative; network-specific limits and required validation must be agreed with the operator.</text>
   </g>
  </g>
 </g>
