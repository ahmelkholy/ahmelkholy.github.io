title: Ahmed M. Elkholy
name: Ahmed M. Elkholy
url: https://ahmelkholy.github.io
baseurl: ""
description: Electrical power engineering, software, and writing about the world.
author: Ahmed M. Elkholy
lang: en
timezone: Europe/Kyiv
encoding: utf-8
markdown: kramdown
highlighter: rouge
permalink: /articles/:year/:month/:title/
future: false
strict_front_matter: true
include: [_pages]
exclude:
  - .codex-local
  - .playwright-mcp
  - .archive
  - .tools
  - .site
  - .bundle
  - vendor
  - node_modules
  - maintenance
  - scripts
  - tests
  - review-artifacts
  - static-docs
  - README.md
  - AUTHOR_GUIDE.md
  - MIGRATION.md
  - SITE_REBUILD_REPORT.md
  - CHANGELOG.md
  - CONTRIBUTING.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
plugins: [jekyll-feed, jekyll-sitemap, jekyll-redirect-from]
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  math_engine: mathjax
collections:
  talks:
    output: true
    permalink: /talks/:name/
  publications:
    output: true
    permalink: /publication/:name/
defaults:
  - scope: {path: ""}
    values: {layout: page, lang: en}
  - scope: {path: "", type: posts}
    values: {layout: post, toc: true}
  - scope: {path: "docs"}
    values: {layout: doc, toc: true}

# Optional public token from Google Search Console (HTML tag verification).
google_site_verification: ""
